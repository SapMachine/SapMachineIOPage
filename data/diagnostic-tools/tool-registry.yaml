# Registry of all diagnostic tools shown on the Diagnostics page.
#
# Each entry controls display order and group membership.
# Use 'repo' for tools fetched from GitHub (.tool.yaml); 'name' for locally-defined tools (in tools/).
# 'order' controls sort position within the group (lower = earlier; ties keep file order).
#
# To add a tool: add an entry here and run `npm run build-jvm-data` (or let CI do it).
# To remove a tool: delete its entry here.

# ── Live JVM Inspection ───────────────────────────────────────────────────────
- repo: https://github.com/parttimenerd/jstall
  group: Live JVM Inspection
  order: 1

- name: jcmd
  group: Live JVM Inspection
  order: 2

- name: jps
  group: Live JVM Inspection
  order: 3

- name: sapmachine-vitals
  group: Live JVM Inspection
  order: 4

- name: high-memory-reports
  group: Live JVM Inspection
  order: 5

- repo: https://github.com/SAP/cf-cli-java-plugin
  group: Live JVM Inspection
  order: 6


# Static/runtime checks and live preview deployment for every Pull Request.
#
# Two jobs run in parallel on the same Solinas runner slot request:
#   - all-checks: static checks + local build + runtime link/page checks
#   - deploy-preview: builds and deploys a live per-PR preview to GitHub Pages
#
# Live preview URL per PR:
#   https://pages.github.tools.sap/<org>/SapMachineIOPage/pr-preview/pr-<N>/
# Previews coexist (one subfolder per PR on the preview-pages branch). The preview
# link is posted as a comment on the PR and kept up to date on every push.
# Removing a preview when a PR is closed/merged is handled by pr-preview-cleanup.yml.
name: PR checks and preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

# One group per PR: a PR's superseded runs cancel, but different PRs run in parallel.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── All static and runtime checks ──────────────────────────────────────────
  all-checks:
    name: PR checks
    runs-on: [self-hosted, solinas]
    steps:
      - name: Checkout PR (full history)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.SAPMACHINE_USER_TOKEN_CI }}
          fetch-depth: 0

      # ── Static check 1: Verify that all required files are present ───────────
      - name: Check required files
        shell: bash
        run: |
          MISSING=()
          TOTAL=0
          while IFS= read -r file; do
            TOTAL=$((TOTAL + 1))
            if [ ! -f "$file" ]; then
              echo "::error file=${file}::Required file is missing: ${file}"
              MISSING+=("$file")
            else
              echo "  ✓ ${file}"
            fi
          done < <(jq -r '.required_files[]' _checks/checks.json)
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo ""
            echo "::error::${#MISSING[@]} required file(s) are missing."
            exit 1
          fi
          echo ""
          echo "All ${TOTAL} required files are present."

      # ── Static check 2: Fail if any file under static/ was deleted ───────────
      - name: Check for deleted assets
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          git fetch origin main
          DELETED=$(git diff --diff-filter=D --name-only FETCH_HEAD...HEAD -- static/ )
          if [ -n "$DELETED" ]; then
            echo "::error::The following files were deleted from static/:"
            while IFS= read -r f; do
              echo "::error file=${f}::File deleted: ${f}"
            done <<< "$DELETED"
            echo ""
            echo "If this deletion is intentional, please document the reason in the PR"
            echo "and update the required-files list in this workflow accordingly."
            exit 1
          fi
          echo "No files deleted from static/ — OK"

      # ── Static check 3: Validate all JSON files under static/assets/data/ ────
      - name: Validate JSON data files
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, sys, glob

          errors = []
          files = sorted(glob.glob('static/assets/data/*.json'))

          if not files:
              print('::error::No JSON files found in static/assets/data/')
              sys.exit(1)

          for path in files:
              try:
                  with open(path) as f:
                      data = json.load(f)
                  print(f'  ✓ {path}')
              except json.JSONDecodeError as exc:
                  errors.append((path, str(exc)))
                  print(f'::error file={path}::Invalid JSON: {exc}')

          # Structural check: env.json must exist and contain required top-level keys
          env_path = 'static/assets/data/env.json'
          try:
              with open(env_path) as f:
                  env = json.load(f)
              for key in ('buildfiles', 'os'):
                  if key not in env:
                      msg = f'Missing required key "{key}"'
                      errors.append((env_path, msg))
                      print(f'::error file={env_path}::{msg} in env.json')
          except FileNotFoundError:
              errors.append((env_path, 'Required file not found'))
              print(f'::error file={env_path}::Required file not found: {env_path}')
          except json.JSONDecodeError:
              pass  # Already captured in the loop above

          if errors:
              sys.exit(1)
          print(f'\nAll {len(files)} JSON file(s) are valid.')
          EOF

      # ── Node.js setup (shared by spell-check, markdown-lint, audit, preview) ─
      - name: Set up Node.js
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # ── Static check 4: Spell check all Markdown files ───────────────────────
      - name: Spell check
        if: ${{ !cancelled() }}
        run: |
          npx --yes cspell@8 lint \
            --config _checks/.cspell.jsonc \
            --no-progress \
            --show-context \
            "docs/**/*.md" \
            "docs/**/*.mdx" \
            "src/pages/*.md" \
            "*.md"

      # ── Static check 5: Lint all Markdown files ──────────────────────────────
      - name: Markdown lint
        if: ${{ !cancelled() }}
        run: |
          npx --yes markdownlint-cli@0 \
            --config _checks/.markdownlint.jsonc \
            "docs/**/*.md" \
            "docs/**/*.mdx" \
            "src/pages/*.md" \
            "*.md"

      # ── Shared install (used by audit and preview checks) ────────────────────
      - name: Install dependencies
        if: ${{ !cancelled() }}
        run: npm ci

      # ── Security check: npm audit ─────────────────────────────────────────────
      - name: Audit dependencies
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          # Always print the full report so every severity level is visible in
          # the CI log. The exit code is non-zero only when the threshold is
          # met, so the step (and the PR) fails only on critical findings.
          npm audit --audit-level=critical

      # ── Runtime checks against a locally-served build ────────────────────────
      # We can't test the deployed preview host directly (pages.github.tools.sap)
      # because it sits behind SSO access control — a CI token can't pass it, so
      # unauthenticated requests are redirected to an HTML login page served as
      # HTTP 200. Instead we build, serve ./build on localhost, and run the SAME
      # shared check scripts (_checks/check_*) that the live-site workflow uses.
      - name: Build site for local checks
        if: ${{ !cancelled() }}
        env:
          SITE_URL: http://127.0.0.1:8080
          BASE_URL: /
        run: npm run build

      - name: Serve built site
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          # python http.server serves dotfiles (needed for /.well-known/security.txt)
          # and directory index.html, and 301-redirects extensionless dir paths.
          nohup python3 -m http.server 8080 --directory build >/tmp/serve.log 2>&1 &
          echo "SERVE_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null "http://127.0.0.1:8080/.well-known/security.txt"; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Local server did not become ready on port 8080"
          cat /tmp/serve.log || true
          exit 1

      - name: Validate security.txt
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SITE_URL: http://127.0.0.1:8080
        run: python3 _checks/check_security_txt.py

      - name: Key pages respond correctly
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SITE_URL: http://127.0.0.1:8080
        run: bash _checks/check_key_pages.sh

      - name: Dead link check
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SITE_URL: http://127.0.0.1:8080
          CRAWL_LOCAL: "1"
        run: bash _checks/check_links.sh

      - name: Stop server
        if: ${{ always() }}
        shell: bash
        run: kill "${SERVE_PID}" 2>/dev/null || true

  # ── Live per-PR preview deployment ─────────────────────────────────────────
  deploy-preview:
    name: Deploy PR preview
    runs-on: [self-hosted, solinas]
    permissions:
      contents: write        # push to the preview-pages branch
      pull-requests: write   # post/update the preview comment
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Docusaurus site
        env:
          SITE_URL: https://pages.github.tools.sap
          BASE_URL: /${{ github.repository }}/pr-preview/pr-${{ github.event.number }}/
        run: npm run build

      - name: Drop CNAME from the preview build
        # Previews are served from pages.github.tools.sap, not sapmachine.io, so the
        # bundled static/CNAME is inert dead weight in each preview folder. Strip it
        # from the preview artifact only; the repo's static/CNAME stays for production.
        run: rm -f build/CNAME

      - name: Deploy preview
        # Pinned to v1.8.1 (full commit SHA) — best practice for third-party actions.
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9
        with:
          source-dir: ./build/
          preview-branch: preview-pages
          umbrella-dir: pr-preview
          pages-base-url: pages.github.tools.sap/${{ github.repository }}
          qr-code: "false"   # don't send preview URLs to the external qr.rossjrw.com service
          action: deploy     # deploy/update only — removal is handled by pr-preview-cleanup.yml
          comment: false
          # comment is posted by the step below instead of by the action. The action's own
          # comment feature derives a version footer by running `git clone https://github.com/
          # rossjrw/pr-preview-action`, which the self-hosted Solinas runner cannot reach
          # (only github.tools.sap is routable), so it aborts with "missing action_version".

      - name: Post / update preview link comment
        # Sticky comment posted via the GHES API (github.tools.sap) — no github.com access
        # needed. Finds the previous bot comment by marker and updates it, else creates one.
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-preview-link -->';
            const url = `https://pages.github.tools.sap/${context.repo.owner}/${context.repo.repo}/pr-preview/pr-${context.issue.number}/`;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const body = [
              marker,
              '## 🚀 Live preview deployed',
              '',
              `Your PR preview is available at: ${url}`,
              '',
              `_Updated for commit ${sha} at ${new Date().toISOString().replace('T', ' ').slice(0, 16)} UTC._`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

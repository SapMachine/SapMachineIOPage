# Test the SapMachineIOPage preview (live site).
# Runs the shared runtime checks (security.txt, key pages, dead links) against the
# live https://sapmachine.io site. The check LOGIC lives once in the scripts under
# _checks/ (check_security_txt.py, check_key_pages.sh, check_links.sh) — the PR
# preview workflow (preview-and-test-pr.yml) runs the same scripts against a
# locally-served build.
# Runs every day at 03:00 UTC, after successful deployment, and can be triggered manually.
name: Test SapMachineIOPage preview (live site)

on:
  # Run every day at 03:00 UTC
  schedule:
    - cron: '0 3 * * *'

  # Trigger after successfully publishing a new version of the sapmachine.io page
  workflow_run:
    workflows: ["Publish sapmachine.io page"]
    types: [completed]
    branches: [main]

  # Allow to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  issues: write        # Needed to auto-create an issue on scheduled failures

env:
  SITE_URL: https://sapmachine.io

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Fetch and validate security.txt
  # ──────────────────────────────────────────────────────────────────────────
  security-txt:
    name: Validate security.txt
    # Skip if triggered by a failed publish run
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, solinas]
    steps:
      - name: Checkout checks
        uses: actions/checkout@v7
        with:
          sparse-checkout: _checks
          sparse-checkout-cone-mode: false

      - name: Fetch and validate security.txt
        shell: bash
        # TODO: remove this token when switch to sapmachine.io
        env:
          GH_TOKEN: ${{ secrets.SAPMACHINE_USER_TOKEN_CI }}
        run: python3 _checks/check_security_txt.py

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: HTTP smoke-test — all key pages must return 2xx or 3xx
  # ──────────────────────────────────────────────────────────────────────────
  key-pages:
    name: Key pages respond correctly
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, solinas]
    steps:
      - name: Checkout checks
        uses: actions/checkout@v7
        with:
          sparse-checkout: _checks
          sparse-checkout-cone-mode: false

      - name: Check HTTP status for key pages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SAPMACHINE_USER_TOKEN_CI }}
        run: bash _checks/check_key_pages.sh

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Dead link check across the entire site
  # ──────────────────────────────────────────────────────────────────────────
  link-check:
    name: Dead link check
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, solinas]
    steps:
      - name: Checkout checks
        uses: actions/checkout@v7
        with:
          sparse-checkout: _checks
          sparse-checkout-cone-mode: false

      - name: Check links on the site
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SAPMACHINE_USER_TOKEN_CI }}
        run: bash _checks/check_links.sh

      # On any failure of a run that targets main, open or update a GitHub issue
      - name: Create issue on broken links (main only)
        if: ${{ failure() && (github.ref_name == 'main' || github.event.workflow_run.head_branch == 'main') }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Broken links detected on the SapMachineIOPage preview';
            const body = [
              '## Broken links detected on the SapMachineIOPage preview',
              '',
              `The scheduled link check run on ${new Date().toISOString().slice(0,10)} found broken links on ${process.env.SITE_URL}/.`,
              '',
              `See the [failed workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for the full muffet report.`,
              '',
              '> This issue was created automatically by the `Test SapMachineIOPage preview (live site)` workflow.',
            ].join('\n');

            // Re-open an existing open issue with the same title instead of creating duplicates
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'broken-links',
            });

            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `New failure detected on ${new Date().toISOString().slice(0,10)}.\n\nSee [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              });
              console.log(`Updated existing issue #${existing.number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['broken-links'],
              });
              console.log(`Created issue #${issue.number}: ${issue.html_url}`);
            }

# Publish the sapmachine.io page
# Builds the Docusaurus site and deploys it directly to GitHub Pages.
# Runs on pushes to the main branch and can also be triggered manually.
name: Publish sapmachine.io page

on:
  # Run on pushes to the main branch
  push:
    branches: ["main"]

  # Allow to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# There is only one sapmachine.io page. Queue runs so an in-progress deployment
# is never interrupted mid-way; a newer run waits for the current one to finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build the Docusaurus site and upload it as a GitHub Pages artifact
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  # Deploy the built artifact to GitHub Pages
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Publish the sapmachine.io page
# Triggers the build and deployment workflows in both SAP/SapMachine-infrastructure and SAP/SapMachine repositories,
# which handle the actual page generation and deployment to GitHub Pages.
# Runs on pushes to main branch and can also be triggered manually.
name: Publish sapmachine.io page

on:
  # Run on pushes to the main branch
  push:
    branches: ["main"]

  # Allow to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# There is only one sapmachine.io page, latest commit should be published, running jobs get canceled.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Trigger job: https://github.com/SAP/SapMachine-infrastructure/actions/workflows/build-gh-pages.yml
  trigger-sapmachine-infra:
    runs-on: [self-hosted, solinas]
    steps:
      - name: Trigger build in SAP/SapMachine-infrastructure repo
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.SAPMACHINE_PAT_ON_GITHUB_COM }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/SAP/SapMachine-infrastructure/actions/workflows/build-gh-pages.yml/dispatches \
            -d '{"ref":"master","inputs":{"event_type":"gh-page-build"}}'

  # Trigger job: https://github.com/SAP/SapMachine/actions/workflows/build-gh-pages.yml
  trigger-sapmachine:
    runs-on: [self-hosted, solinas]
    steps:
      - name: Trigger build in SAP/SapMachine repo
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.SAPMACHINE_PAT_ON_GITHUB_COM }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/SAP/SapMachine/actions/workflows/build-gh-pages.yml/dispatches \
            -d '{"ref":"sapmachine","inputs":{"event_type":"gh-page-build"}}'

  status-sapmachine-infra:
    runs-on: [ self-hosted, solinas ]
    needs: trigger-sapmachine-infra
    steps:
      - name: Wait for workflow completion
        id: wait-for-completion
        run: |
          echo "Waiting for workflow to start..."
          sleep 60  # Wait for workflow to start
          
          # Get the latest workflow run
          WORKFLOW_ID=$(curl -s -H "Authorization: token ${{ secrets.SAPMACHINE_PAT_ON_GITHUB_COM }}" \
            "https://api.github.com/repos/SAP/SapMachine-infrastructure/actions/workflows" | \
            jq -r '.workflows[] | select(.name=="Build and deploy sapmachine.io page") | .id')
          echo "Workflow ID: $WORKFLOW_ID"
          
          # Poll for completion
          while true; do
            STATUS=$(curl -s -H "Authorization: token ${{ secrets.SAPMACHINE_PAT_ON_GITHUB_COM }}" \
              "https://api.github.com/repos/SAP/SapMachine-infrastructure/actions/workflows/$WORKFLOW_ID/runs?per_page=1" | \
              jq -r '.workflow_runs[0].status')
            CONCLUSION=$(curl -s -H "Authorization: token ${{ secrets.SAPMACHINE_PAT_ON_GITHUB_COM }}" \
              "https://api.github.com/repos/SAP/SapMachine-infrastructure/actions/workflows/$WORKFLOW_ID/runs?per_page=1" | \
              jq -r '.workflow_runs[0].conclusion')
            echo "Status: $STATUS, Conclusion: $CONCLUSION"
            
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "Workflow completed successfully!"
                echo "success=true" >> $GITHUB_OUTPUT
                break
              else
                echo "Workflow failed with conclusion: $CONCLUSION"
                echo "success=false" >> $GITHUB_OUTPUT
                exit 1
              fi
            fi
            sleep 30  # Wait 30 seconds before next check
          done

  status-sapmachine:
    runs-on: [ self-hosted, solinas ]
    needs: trigger-sapmachine
    steps:
      - name: Wait for workflow completion
        id: wait-for-completion
        run: |
          echo "Waiting for workflow to start..."
          sleep 60  # Wait for workflow to start
          
          # Get the latest workflow run
          WORKFLOW_ID=$(curl -s -H "Authorization: token ${{ secrets.SAPMACHINE_PAT_ON_GITHUB_COM }}" \
            "https://api.github.com/repos/SAP/SapMachine/actions/workflows" | \
            jq -r '.workflows[] | select(.name=="Build and deploy sapmachine.io page") | .id')
          echo "Workflow ID: $WORKFLOW_ID"
          
          # Poll for completion
          while true; do
            STATUS=$(curl -s -H "Authorization: token ${{ secrets.SAPMACHINE_PAT_ON_GITHUB_COM }}" \
              "https://api.github.com/repos/SAP/SapMachine/actions/workflows/$WORKFLOW_ID/runs?per_page=1" | \
              jq -r '.workflow_runs[0].status')
            CONCLUSION=$(curl -s -H "Authorization: token ${{ secrets.SAPMACHINE_PAT_ON_GITHUB_COM }}" \
              "https://api.github.com/repos/SAP/SapMachine/actions/workflows/$WORKFLOW_ID/runs?per_page=1" | \
              jq -r '.workflow_runs[0].conclusion')
            echo "Status: $STATUS, Conclusion: $CONCLUSION"
            
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "Workflow completed successfully!"
                echo "success=true" >> $GITHUB_OUTPUT
                break
              else
                echo "Workflow failed with conclusion: $CONCLUSION"
                echo "success=false" >> $GITHUB_OUTPUT
                exit 1
              fi
            fi
            sleep 30  # Wait 30 seconds before next check
          done
